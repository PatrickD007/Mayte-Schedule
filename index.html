<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tranquility Base Schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#F3EFE7; --surface:#FFFFFF; --surface-2:#EDE7DA;
    --ink:#2A2520; --muted:#746C60; --line:#DED5C4;
    --room1:#1F7A8C; --room2:#B8791A; --room4:#7A3B6D;
    --gc:#5B6B73; --off:#8A8378; --gc-bg:#E7E2D8; --off-bg:#E9E4DA;
    --new:#3F7A4E; --new-bg:#E4EFE3;
    --update:#35507A; --update-bg:#E3E8F0;
    --cancelled:#A6402F; --cancelled-bg:#F3E3DF;
    --room1-bg:#DEEAEC; --room2-bg:#F3E7D2; --room4-bg:#EBDDE8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1A16; --surface:#2A2520; --surface-2:#332D26;
      --ink:#F2EEE6; --muted:#B3AA9C; --line:#453D33;
      --room1:#5BB6C7; --room2:#E0A63E; --room4:#B879AA;
      --gc:#9AA9B0; --off:#B0A996; --gc-bg:#333B3F; --off-bg:#3A362D;
      --new:#79C08C; --new-bg:#2C3B2E;
      --update:#8AA6D6; --update-bg:#2A3245;
      --cancelled:#E08A78; --cancelled-bg:#402A26;
      --room1-bg:#233C41; --room2-bg:#3C3222; --room4-bg:#3A2C37;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E1A16; --surface:#2A2520; --surface-2:#332D26;
    --ink:#F2EEE6; --muted:#B3AA9C; --line:#453D33;
    --room1:#5BB6C7; --room2:#E0A63E; --room4:#B879AA;
    --gc:#9AA9B0; --off:#B0A996; --gc-bg:#333B3F; --off-bg:#3A362D;
    --new:#79C08C; --new-bg:#2C3B2E;
    --update:#8AA6D6; --update-bg:#2A3245;
    --cancelled:#E08A78; --cancelled-bg:#402A26;
    --room1-bg:#233C41; --room2-bg:#3C3222; --room4-bg:#3A2C37;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px; margin:0 auto; padding:20px 18px 48px}
  header{padding:8px 0 18px}
  .house{font-size:22px; font-weight:800; letter-spacing:-0.01em}
  .sub{font-size:14px; color:var(--muted); margin-top:2px}

  .legend{display:flex; gap:8px; margin:18px 0 22px}
  .door{flex:1; border-radius:14px; padding:10px 6px; text-align:center; border:1px solid var(--line)}
  .door .num{font-size:20px; font-weight:800; line-height:1}
  .door .name{font-size:10.5px; margin-top:4px; color:var(--muted); line-height:1.2}
  .door.r1{background:var(--room1-bg)} .door.r1 .num{color:var(--room1)}
  .door.r2{background:var(--room2-bg)} .door.r2 .num{color:var(--room2)}
  .door.r4{background:var(--room4-bg)} .door.r4 .num{color:var(--room4)}
  .door.r3{opacity:.55}
  .door.r3 .num{color:var(--muted)}

  .hero{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:22px}
  .hero .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700}
  .hero .row{display:flex; align-items:baseline; gap:12px; margin-top:8px}
  .hero .date{font-size:34px; font-weight:800; letter-spacing:-0.02em}

  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin:0 0 10px 2px}

  .list{display:flex; flex-direction:column; gap:8px}
  .item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
  .item .date{font-size:17px; font-weight:700; width:44px; flex:0 0 auto}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:14px; font-weight:800; padding:5px 11px; border-radius:999px; flex:0 0 auto}
  .chip.r1{background:var(--room1-bg); color:var(--room1)}
  .chip.r2{background:var(--room2-bg); color:var(--room2)}
  .chip.r4{background:var(--room4-bg); color:var(--room4)}
  .chip.gc{background:var(--gc-bg); color:var(--gc)}
  .chip.off{background:var(--off-bg); color:var(--off)}
  .old-date{text-decoration:line-through; opacity:.55; font-weight:600; font-size:13px}
  .tag{margin-left:auto; font-size:11px; font-weight:800; letter-spacing:.03em; padding:4px 9px; border-radius:999px; flex:0 0 auto}
  .tag.new{background:var(--new-bg); color:var(--new)}
  .tag.update{background:var(--update-bg); color:var(--update)}
  .tag.cancelled{background:var(--cancelled-bg); color:var(--cancelled)}
  .item.is-cancelled{opacity:.6}
  .item.is-cancelled .date, .item.is-cancelled .chip{text-decoration:line-through; text-decoration-thickness:2px}
  .empty{color:var(--muted); font-size:14px; padding:6px 2px}

  .cal-room-label{display:flex; align-items:center; gap:10px; margin:22px 0 10px}
  .cal-room-label .name{font-weight:700; font-size:15px}
  .cal-month{margin-bottom:16px}
  .cal-month-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-dow{font-size:10px; text-align:center; color:var(--muted); font-weight:700; padding-bottom:2px}
  .cal-cell{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:12.5px; border-radius:7px; background:var(--surface); border:1px solid var(--line); color:var(--muted)}
  .cal-cell.cal-empty{border:none; background:transparent}
  .cal-cell.cal-out{opacity:.32}
  .cal-cell.occ{color:var(--ink); font-weight:800; border-color:transparent}
  .cal-cell.cal-today{box-shadow:0 0 0 2px var(--ink) inset}
  .cal-cell.tag-new{box-shadow:0 0 0 2px var(--new) inset}
  .cal-cell.tag-update{box-shadow:0 0 0 2px var(--update) inset}
  .cal-cell.tag-cancelled{box-shadow:0 0 0 2px var(--cancelled) inset}
  .gc-dot{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--gc)}

  footer{margin-top:28px; font-size:12.5px; color:var(--muted); text-align:center; line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="house">🧹 Tranquility Base</div>
    <div class="sub">Cleaning &amp; changeover schedule</div>
  </header>

  <div class="legend">
    <div class="door r1"><div class="num">1</div><div class="name">Peaceful Room</div></div>
    <div class="door r2"><div class="num">2</div><div class="name">Primary Suite</div></div>
    <div class="door r3"><div class="num">3</div><div class="name">storage</div></div>
    <div class="door r4"><div class="num">4</div><div class="name">Peaceful Suite</div></div>
  </div>

  <div class="hero" id="hero">
    <div class="eyebrow">Next visit</div>
    <div class="row" id="heroRow"><span class="empty">Loading…</span></div>
  </div>

  <div class="section-label">Upcoming</div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>

  <div class="section-label" style="margin-top:26px">Room Calendars</div>
  <div id="calendars"></div>

  <footer>Updated by Patrick · questions, just text him</footer>
</div>

<script>
function fmtDate(iso){ const [y,m,d] = iso.split("-").map(Number); return `${m}/${d}`; }
function chipClass(e){ return e.kind === "gc" ? "gc" : e.kind === "off" ? "off" : "r" + e.room; }
function chipLabel(e){ return e.kind === "gc" ? "GC" : e.kind === "off" ? "Off" : e.room; }

const ROOM_NAMES = {"1": "Peaceful Room", "2": "Primary Suite", "4": "Peaceful Suite"};

function monthGrid(year, monthIdx){
  const startDow = new Date(year, monthIdx, 1).getDay();
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  const cells = Array(startDow).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}
function isoDate(year, monthIdx, day){
  return `${year}-${String(monthIdx + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function bookingColor(room, index){
  const pct = 16 + (index % 4) * 12; // 16, 28, 40, 52 -- distinct tints of this room's own hue
  return `color-mix(in srgb, var(--room${room}) ${pct}%, var(--surface))`;
}

function buildRoomCalendarHTML(room, occupied, allBookings, gcDates, windowDays){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayIso = today.toISOString().slice(0, 10);
  const windowEnd = new Date(today);
  windowEnd.setDate(windowEnd.getDate() + windowDays - 1);
  const windowEndIso = windowEnd.toISOString().slice(0, 10);

  const sortedOccupied = [...occupied].sort((a, b) => a.checkIn.localeCompare(b.checkIn));

  let html = "";
  let cursor = new Date(today.getFullYear(), today.getMonth(), 1);
  const lastMonth = new Date(windowEnd.getFullYear(), windowEnd.getMonth(), 1);

  while (cursor <= lastMonth){
    const year = cursor.getFullYear(), monthIdx = cursor.getMonth();
    html += `<div class="cal-month"><div class="cal-month-label">${cursor.toLocaleDateString(undefined, {month: "long", year: "numeric"})}</div><div class="cal-grid">`;
    ["S","M","T","W","T","F","S"].forEach(w => html += `<div class="cal-dow">${w}</div>`);
    for (const day of monthGrid(year, monthIdx)){
      if (day === null){ html += `<div class="cal-cell cal-empty"></div>`; continue; }
      const iso = isoDate(year, monthIdx, day);
      const inWindow = iso >= todayIso && iso <= windowEndIso;
      let cls = "cal-cell";
      let style = "";
      if (!inWindow){
        cls += " cal-out";
      } else {
        const bookingIdx = sortedOccupied.findIndex(b => iso >= b.checkIn && iso < b.date);
        if (bookingIdx !== -1){ cls += " occ"; style = ` style="background:${bookingColor(room, bookingIdx)}"`; }
        const checkoutHere = allBookings.find(b => b.date === iso);
        if (checkoutHere && checkoutHere.tag) cls += " tag-" + checkoutHere.tag;
      }
      if (iso === todayIso) cls += " cal-today";
      const gcDot = (inWindow && gcDates.has(iso)) ? `<span class="gc-dot"></span>` : "";
      html += `<div class="${cls}"${style}>${day}${gcDot}</div>`;
    }
    html += `</div></div>`;
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return html;
}

function renderCalendars(entries){
  const container = document.getElementById("calendars");
  container.innerHTML = "";
  const gcDates = new Set(entries.filter(e => e.kind === "gc").map(e => e.date));
  for (const room of ["1", "2", "4"]){
    const roomBookings = entries.filter(e => e.kind === "turnover" && e.room === room);
    const occupied = roomBookings.filter(e => e.tag !== "cancelled");
    const label = document.createElement("div");
    label.className = "cal-room-label";
    label.innerHTML = `<span class="chip r${room}">${room}</span><span class="name">${ROOM_NAMES[room]}</span>`;
    container.appendChild(label);
    const block = document.createElement("div");
    block.innerHTML = buildRoomCalendarHTML(room, occupied, roomBookings, gcDates, 30);
    container.appendChild(block);
  }
}

fetch("schedule.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const today = new Date().toISOString().slice(0,10);
    const entries = [...data.entries].sort((a,b) => a.date.localeCompare(b.date));

    const upcoming = entries.filter(e => e.date >= today || e.tag === "cancelled");
    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!upcoming.length){
      list.innerHTML = '<div class="empty">Nothing scheduled.</div>';
    } else {
      for (const e of upcoming){
        const row = document.createElement("div");
        row.className = "item" + (e.tag === "cancelled" ? " is-cancelled" : "");
        row.innerHTML = `
          <div class="date">${fmtDate(e.date)}</div>
          <span class="chip ${chipClass(e)}">${chipLabel(e)}</span>
          ${e.tag === "update" && e.oldDate ? `<span class="old-date">${fmtDate(e.oldDate)}</span>` : ""}
          ${e.tag ? `<span class="tag ${e.tag}">${e.tag.toUpperCase()}</span>` : ""}
        `;
        list.appendChild(row);
      }
    }

    const next = entries.find(e => e.date >= today && e.tag !== "cancelled");
    const heroRow = document.getElementById("heroRow");
    heroRow.innerHTML = next
      ? `<div class="date">${fmtDate(next.date)}</div><span class="chip ${chipClass(next)}">${chipLabel(next)}</span>`
      : '<span class="empty">Nothing upcoming.</span>';

    renderCalendars(entries);
  })
  .catch(() => {
    document.getElementById("list").innerHTML = '<div class="empty">Couldn\'t load the schedule — try refreshing.</div>';
  });
</script>
</body>
</html>
