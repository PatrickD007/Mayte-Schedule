name: Sync Airbnb calendars

on:
  schedule:
    - cron: "17 * * * *"  # every hour at :17, UTC -- avoids the top-of-hour congestion that most commonly delays GitHub's scheduled runs
  workflow_dispatch: {}   # allows manually triggering a run from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync
        id: sync
        run: |
          OUTPUT=$(python sync_calendars.py \
            "${{ secrets.ROOM1_ICAL_URL }}" \
            "${{ secrets.ROOM2_ICAL_URL }}" \
            "${{ secrets.ROOM4_ICAL_URL }}")
          echo "$OUTPUT"
          {
            echo "output<<SYNC_EOF"
            echo "$OUTPUT"
            echo "SYNC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push schedule.json if it changed
        if: contains(steps.sync.outputs.output, 'CHANGED') && !contains(steps.sync.outputs.output, 'UNCHANGED')
        run: |
          git config user.name "Tranquility Base Bot"
          git config user.email "tranquilitybaseairbnbbot@gmail.com"
          git add schedule.json
          git commit -m "Automated calendar sync"
          git push

      - name: Notify Patrick if there was real news
        if: contains(steps.sync.outputs.output, 'NOTE:')
        run: |
          DRAFT=$(python render_draft.py)
          # No click URL set below -- per ntfy's iOS behavior, tapping a
          # notification with no click URL copies its full text to the
          # clipboard, letting Patrick paste straight into Messages.
          curl -s -d "$DRAFT" -H "Title: Tranquility Base - schedule change" https://ntfy.sh/tranquillitybase-patrick-mayte-8f2kqyzzz007
